name: CI

on:
  push:
    branches: [main]
  # release-please opens its release PR with GITHUB_TOKEN, which creates a
  # pull_request run that can only sit in action_required. Its output set is
  # exactly these files, so excluding them means no run is ever created.
  pull_request:
    branches: [main]
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - default.nix
      - flake.nix
      - package.nix

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WORKSPACE_TESTS: '^Test(Workspace|RemoveWorkspaceRepository|ResolveWorktreePathResolvesFacadeLink|ReturnOutsideRepository)'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        if: matrix.os != 'windows-latest'
        run: go test ./...

      # Windows Git subprocesses make the combined cmd suite exceed Go's 10m timeout.
      # Keep complementary partitions and avoid contention with the pool suite.
      - name: Test Windows core
        if: matrix.os == 'windows-latest'
        run: go test -p 1 ./... -skip "$env:WORKSPACE_TESTS"

      - name: Test Windows workspaces
        if: matrix.os == 'windows-latest'
        run: go test -p 1 ./... -run "$env:WORKSPACE_TESTS"

      - name: Build
        run: go build -o treehouse${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
